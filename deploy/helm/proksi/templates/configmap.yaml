apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "proksi.name" . }}
  labels: {{- include "proksi.labels" . | nindent 4 }}
data:
  proksi.hcl: |
    kubernetes {
      enabled         = true
      ingress_class   = {{ .Values.ingressClass.name | quote }}
      namespaces      = {{ .Values.namespaces | toJson }}
      publish_service = {{ printf "%s/%s" .Release.Namespace (include "proksi.name" .) | quote }}
    }

{{ .Values.config | indent 4 }}
