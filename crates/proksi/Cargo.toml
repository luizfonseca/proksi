[package]
name = "proksi"
description = "A batteries-included reverse proxy with automatic HTTPS using Cloudflare Pingora and Let's Encrypt."
version = "0.17.3"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["proxy", "https", "reverse-proxy", "load-balancer", "pingora"]
categories = ["web-programming::http-server", "network-programming"]
exclude = [
    "*.yaml",
    "*.yml",
    "*.toml",
    "src/*.md",
    "examples/",
    "dist/",
    "docs/",
    "target/",
    "tests/",
    "assets/",
    "tmp/",
    "Makefile",
    "Dockerfile",
    "gitbook/",
    ".github/",
]
authors = ["The Proksi Contributors <toaster.chicory-0b@icloud.com>"]
readme = "../../README.md"
homepage = "https://github.com/luizfonseca/proksi"
repository = "https://github.com/luizfonseca/proksi"
rust-version.workspace = true
workspace = "../.."

[features]
default = ["kubernetes"]
# Kubernetes ingress controller (ADR 0005)
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:futures-util"]
store-sqlite = ["proksi_store/sqlite"]
store-postgres = ["proksi_store/postgres"]

[dependencies]
TinyUFO = "0.9.0"
proksi-admin-ui = { path = "../proksi-admin-ui", version = "0.17.3" }
acme-v2 = "1.0.0"
anyhow = "1.0.104"
arc-swap = "1.7.1"
schemars = "1.2.3"
async-trait = "0.1.89"
bollard = "0.21.1"
bytes = "1.11.1"
clap = { version = "4.5.53", features = ["derive", "cargo"] }
dashmap = "6.1.0"
figment = { version = "0.10.19", features = ["yaml", "env"] }
hcl-rs = "0.19.4"
http = "1.2.0"
ipnet = "2.11.0"
nix = { version = "0.31.3", features = ["signal", "hostname", "process", "resource", "feature"] }
notify = { version = "8.0.0", default-features = false, features = [
    "fsevent-sys",
] }
num_cpus = "1.17.0"
once_cell = "1.21.3"
openssl = { version = "0.10", features = ["vendored"] }
papaya = "0.2.3"
proksi_plugins = { path = "../proksi_plugins", version = "0.17.3" }
proksi_store = { path = "../proksi_store", version = "0.17.3" }
path-tree = "0.8.3"
pingora = { version = "0.9.0", features = ["lb", "openssl", "proxy", "cache"] }
pingora-cache = "0.9.0"
pingora-error = "0.9.0"
prometheus = "0.14.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls-no-alpn", "charset", "http2", "system-proxy"] }
seize = "0.5.1"
serde = "1.0.228"
serde_json = "1.0.145"
redis = { version = "1.7.1", features = ["r2d2"] }
r2d2 = { version = "0.8.10" }
time = { version = "0.3.55", features = ["macros", "formatting"] }
tokio = { version = "1.48.0", features = [
    "sync",
    "rt-multi-thread",
    "fs",
    "io-std",
    "macros",
    "process",
    "signal",
] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.20", features = ["json", "env-filter"] }
uuid = { version = "1.18.1", features = ["v4"] }
rand = "0.8"
kube = { version = "4.2.0", default-features = false, features = ["client", "openssl-tls", "runtime"], optional = true }
k8s-openapi = { version = "0.28.0", features = ["v1_32"], optional = true }
futures-util = { version = "0.3.34", optional = true }
dns-lookup = "4.0.2"
regex = "1"
regex-automata = "0.4"
# Lists of values in rules, searched at once (already in the tree through regex)
aho-corasick = "1"
# wasmtime = "31.0.0"

[[bench]]
name = "dashmap_arc"
harness = false
path = "../../benches/dashmap_arc.rs"

[dev-dependencies]
# Signs the tokens of the jwt tests
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
proksi_plugins = { path = "../proksi_plugins", version = "0.17.3", features = ["test-util"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
proksi_store = { path = "../proksi_store", version = "0.17.3", features = ["test-util"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
figment = { version = "0.10.19", features = ["toml", "yaml", "env", "test"] }
futures-util = "0.3.34"
native-tls = { version = "0.2.14", features = ["alpn"] }
# Tests' clients also negotiate HTTP/2, as browsers do
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2"] }
nix = { version = "0.31.3", features = ["signal", "resource"] }
# The nesting check (tests/nesting.rs) reads the sources
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["macros", "net", "io-util", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
jsonschema = { version = "0.33", default-features = false }

[lints]
workspace = true
