[package]
name = "proksi_store"
description = "The stores shared by Proksi replicas: routes, certificates, leases and replica reports."
version = "0.15.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Proksi Contributors <toaster.chicory-0b@icloud.com>"]
homepage = "https://github.com/luizfonseca/proksi"
repository = "https://github.com/luizfonseca/proksi"
rust-version.workspace = true
workspace = "../.."

[features]
# Certificates for tests, used by Proksi's tests
test-util = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-native-tls"]

[dependencies]
async-trait = "0.1.89"
openssl = { version = "0.10", features = ["vendored"] }
papaya = "0.2.3"
r2d2 = "0.8"
redis = { version = "1.7.1", features = ["r2d2"] }
seize = "0.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", default-features = false, features = ["any", "macros", "migrate", "runtime-tokio"], optional = true }
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tracing = "0.1.43"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
