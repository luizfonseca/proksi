<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{refresh}">
<title>You're in line</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 28rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  .place { font-size: 3rem; font-weight: 700; margin: 1rem 0; }
  p { margin: .25rem 0; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>You're in line</h1>
  <p>So many people are visiting right now that we let them in a few at a time.</p>
  <div class="place">{position}</div>
  <p>Your place in line, out of {waiting} waiting.</p>
  <p>This page checks again every {refresh} seconds: keep it open and you'll be let in.</p>
</main>
</body>
</html>
