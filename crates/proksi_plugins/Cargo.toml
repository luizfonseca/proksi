[package]
name = "proksi_plugins"
description = "Proksi's built-in plugins: authentication, limits, CORS, redirects, static files and more."
version = "0.16.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Proksi Contributors <toaster.chicory-0b@icloud.com>"]
homepage = "https://github.com/luizfonseca/proksi"
repository = "https://github.com/luizfonseca/proksi"
rust-version.workspace = true
workspace = "../.."

[features]
# The counting allocator of tests that check the hot path doesn't allocate, used by Proksi's tests
test-util = ["dep:mimalloc"]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.7.1"
async-trait = "0.1.89"
bytes = "1.11.1"
cookie = { version = "0.18.1", features = ["private"] }
http = "1.2.0"
httpdate = "1.0.3"
ipnet = "2.11.0"
itertools = "0.15.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
openssl = { version = "0.10", features = ["vendored"] }
pingora = { version = "0.9.0", features = ["lb", "openssl", "proxy", "cache"] }
pingora-limits = "0.9.0"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls-no-alpn", "charset", "http2", "system-proxy"] }
short-crypt = "1.0.28"
ring = "0.17.14"
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.48.0", features = ["sync", "time"] }
tracing = "0.1.43"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
mimalloc = { version = "0.1.52", default-features = false }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
