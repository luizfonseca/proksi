name: CodSpeed

# Runs the micro-benchmarks of `benches/` with CodSpeed's CPU simulation, which reports
# their changes on every pull request.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets CodSpeed trigger runs on past commits, for initial data
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain of rust-toolchain.toml, with the compiled dependencies cached
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed

      - name: Build the benchmarks
        run: cargo codspeed build -m simulation -p proksi

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -p proksi
