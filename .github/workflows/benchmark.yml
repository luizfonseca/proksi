name: Benchmark

# Compares the performance of the pull request with its base (latency, CPU, memory).
# The report is posted as a comment by `benchmark-comment.yml`, which runs with
# permission to comment (this workflow doesn't, as it runs the pull request's code).

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Both binaries are built the same way, faster than the release profile (full LTO)
  BUILD_FLAGS: --release -p proksi --config profile.release.lto="thin" --config profile.release.codegen-units=16
  OHA_VERSION: v1.16.0
  OHA_SHA256: 620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    services:
      upstream:
        image: nginx:alpine
        ports:
          - 8080:80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache the base binary
        id: base-cache
        uses: actions/cache@v4
        with:
          path: bench-bin/base
          key: proksi-benchmark-${{ github.event.pull_request.base.sha }}

      - name: Build the base
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          git worktree add ../proksi-base ${{ github.event.pull_request.base.sha }}
          (cd ../proksi-base && CARGO_TARGET_DIR=${{ github.workspace }}/target cargo build $BUILD_FLAGS)
          mkdir -p bench-bin
          cp target/release/proksi bench-bin/base

      - name: Build the pull request
        run: |
          cargo build $BUILD_FLAGS
          mkdir -p bench-bin
          cp target/release/proksi bench-bin/head

      - name: Install oha
        run: |
          curl -sSL -o oha https://github.com/hatoo/oha/releases/download/$OHA_VERSION/oha-linux-amd64
          echo "$OHA_SHA256  oha" | sha256sum --check
          chmod +x oha

      - name: Run the benchmark
        run: |
          mkdir -p results
          python3 .github/benchmark/compare.py \
            --base bench-bin/base \
            --head bench-bin/head \
            --oha ./oha \
            --upstream 127.0.0.1:8080 \
            --out results/report.md \
            --raw results/raw.json
          echo "${{ github.event.pull_request.number }}" > results/pr-number
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
          retention-days: 7
