name: Discord ping notification
on:
  release:
    types: [released]

jobs:
  github-releases-to-discord:
    name: Publish Github Releases announcement to Discord
    # The admin UI is released with proksi: its own releases aren't announced
    if: ${{ !startsWith(github.event.release.tag_name, 'proksi-admin-ui-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Github Releases To Discord
        uses: SethCohen/github-releases-to-discord@v1.13.1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Prok"
          content: "||@everyone||"
          footer_title: "Changelog"
          footer_timestamp: true
