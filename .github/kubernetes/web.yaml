# The application of the kubernetes test, with an Ingress for proksi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=hello from web"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    proksi.info/tls: "false"
spec:
  ingressClassName: proksi
  rules:
    - host: web.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
# HTTPS with the certificate of a TLS secret (created by test.sh), through the service's address
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-tls
  annotations:
    proksi.info/upstream: service
spec:
  ingressClassName: proksi
  tls:
    - hosts: ["secure.test"]
      secretName: web-tls
  rules:
    - host: secure.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
# Plugins through the annotation, with basic_auth's settings from a labelled secret (test.sh)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-auth
  annotations:
    proksi.info/tls: "false"
    proksi.info/blocks: |
      basic_auth {}
      headers {
        response {
          add = { "x-from" = "ingress" }
        }
      }
    proksi.info/auth-secret: web-auth
spec:
  ingressClassName: proksi
  rules:
    - host: auth.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
