<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">proksi.hcl and Proksi, live</title>
  <desc id="desc">On the left, proksi.hcl with two hosts and a rule, and a terminal starting a container with a proksi.host label. On the right, Proksi's routes and events, live: the container's host appears and gets a Let's Encrypt certificate, a second upstream typed into proksi.hcl is applied without dropping connections, and a POST matching the rule is rate limited.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #e6edf3; white-space: pre; }
    .k { fill: #34d399; } .s { fill: #7dd3fc; } .m { fill: #9198a1; } .f { fill: #6e7681; }
    .ui { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; fill: #9198a1; }
    .head { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #9198a1; letter-spacing: .06em; text-transform: uppercase; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .settled { opacity: 1 !important; } .typed { width: 600px !important; } }
  </style>
  <rect x="10" y="10" width="940" height="500" rx="14" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
  <path d="M10,24 a14,14 0 0 1 14,-14 h912 a14,14 0 0 1 14,14 v22 h-940 z" fill="#151b23"/>
  <line x1="10" y1="46" x2="950" y2="46" stroke="#3d444d" stroke-width="1.5"/>
  <circle cx="32" cy="28" r="5.5" fill="#ff5f57"/>
  <circle cx="50" cy="28" r="5.5" fill="#febc2e"/>
  <circle cx="68" cy="28" r="5.5" fill="#28c840"/>
  <text class="ui" x="110" y="32">proksi.hcl</text>
  <text class="ui" x="500" y="32">Proksi · live</text>
  <line x1="480" y1="46" x2="480" y2="510" stroke="#3d444d" stroke-width="1.5"/>
  <rect class="motion" x="12" y="223" width="466" height="165" fill="#1e1b4b" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.6615;0.6846;0.8769;0.9077;1"/>
  </rect>
  <rect class="motion" x="12" y="118" width="466" height="15" fill="#0f2f25" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.3692;0.3846;0.5385;0.5692;1"/>
  </rect>
  <defs>
    <clipPath id="typing-line"><rect class="typed" x="64" y="117" height="15" width="0">
      <animate attributeName="width" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;220;220;0" keyTimes="0;0.3692;0.4462;0.9846;1"/>
    </rect></clipPath>
    <clipPath id="typing-command"><rect class="typed" x="46" y="456" height="20" width="0">
      <animate attributeName="width" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;358;358;0" keyTimes="0;0.0231;0.1231;0.9846;1"/>
    </rect></clipPath>
  </defs>
  <text class="f" x="50" y="84" text-anchor="end">1</text>
  <text x="64" y="84"><tspan class="k">host</tspan> <tspan class="s">&quot;shop.example.com&quot;</tspan> {</text>
  <text class="f" x="50" y="99" text-anchor="end">2</text>
  <text x="64" y="99">  <tspan class="k">location</tspan> <tspan class="s">&quot;/&quot;</tspan> {</text>
  <text class="f" x="50" y="114" text-anchor="end">3</text>
  <text x="64" y="114">    <tspan class="k">upstream</tspan> <tspan class="s">&quot;app-1:3000&quot;</tspan> {}</text>
  <text class="f" x="50" y="129" text-anchor="end">4</text>
  <text x="64" y="129" clip-path="url(#typing-line)">    <tspan class="k">upstream</tspan> <tspan class="s">&quot;app-2:3000&quot;</tspan> {}</text>
  <text class="f" x="50" y="144" text-anchor="end">5</text>
  <text x="64" y="144">  }</text>
  <text class="f" x="50" y="159" text-anchor="end">6</text>
  <text x="64" y="159">}</text>
  <text class="f" x="50" y="174" text-anchor="end">7</text>
  <text x="64" y="174"><tspan class="k">host</tspan> <tspan class="s">&quot;api.example.com&quot;</tspan> {</text>
  <text class="f" x="50" y="189" text-anchor="end">8</text>
  <text x="64" y="189">  <tspan class="k">location</tspan> <tspan class="s">&quot;/v1&quot;</tspan> {</text>
  <text class="f" x="50" y="204" text-anchor="end">9</text>
  <text x="64" y="204">    <tspan class="k">upstream</tspan> <tspan class="s">&quot;api:4000&quot;</tspan> {}</text>
  <text class="f" x="50" y="219" text-anchor="end">10</text>
  <text x="64" y="219">  }</text>
  <text class="f" x="50" y="234" text-anchor="end">11</text>
  <text x="64" y="234">  <tspan class="k">rule</tspan> <tspan class="s">&quot;writes&quot;</tspan> {</text>
  <text class="f" x="50" y="249" text-anchor="end">12</text>
  <text x="64" y="249">    <tspan class="k">and</tspan> {</text>
  <text class="f" x="50" y="264" text-anchor="end">13</text>
  <text x="64" y="264">      method { in = [<tspan class="s">&quot;POST&quot;</tspan>, <tspan class="s">&quot;PUT&quot;</tspan>] }</text>
  <text class="f" x="50" y="279" text-anchor="end">14</text>
  <text x="64" y="279">    }</text>
  <text class="f" x="50" y="294" text-anchor="end">15</text>
  <text x="64" y="294">    <tspan class="k">then</tspan> {</text>
  <text class="f" x="50" y="309" text-anchor="end">16</text>
  <text x="64" y="309">      rate_limit {</text>
  <text class="f" x="50" y="324" text-anchor="end">17</text>
  <text x="64" y="324">        requests = 30</text>
  <text class="f" x="50" y="339" text-anchor="end">18</text>
  <text x="64" y="339">        per      = <tspan class="s">&quot;1m&quot;</tspan></text>
  <text class="f" x="50" y="354" text-anchor="end">19</text>
  <text x="64" y="354">      }</text>
  <text class="f" x="50" y="369" text-anchor="end">20</text>
  <text x="64" y="369">    }</text>
  <text class="f" x="50" y="384" text-anchor="end">21</text>
  <text x="64" y="384">  }</text>
  <text class="f" x="50" y="399" text-anchor="end">22</text>
  <text x="64" y="399">}</text>
  <line x1="10" y1="432" x2="480" y2="432" stroke="#3d444d" stroke-width="1.5"/>
  <text class="head" x="30" y="450">terminal</text>
  <text class="k" x="30" y="471">$</text>
  <text x="46" y="471" clip-path="url(#typing-command)">docker run -l proksi.host=whoami.local whoami</text>
  <text class="head" x="500" y="74">routes</text>
  <g>
    <rect x="496" y="83" width="436" height="28" rx="7" fill="#151b23"/>
    <text x="510" y="101">shop.example.com</text>
    <text class="m motion" x="680" y="101">app-1
      <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;0.4615;0.9846"/>
    </text>
    <text class="m settled" x="680" y="101" opacity="0">app-1, app-2
      <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4615;0.9846"/>
    </text>
    <rect x="908" y="93" width="12" height="10" rx="2" fill="#34d399"/><path d="M910.5,93 v-2.5 a3.5,3.5 0 0 1 7,0 v2.5" fill="none" stroke="#34d399" stroke-width="1.8"/>
  </g>
  <g>
    <rect x="496" y="119" width="436" height="28" rx="7" fill="#151b23"/>
    <text x="510" y="137">api.example.com</text>
    <text class="m" x="680" y="137">api:4000</text>
    <rect x="908" y="129" width="12" height="10" rx="2" fill="#34d399"/><path d="M910.5,129 v-2.5 a3.5,3.5 0 0 1 7,0 v2.5" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <text class="m" x="526" y="161">↳ rule "writes"  →  rate_limit</text>
  </g>
  <g class="settled">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1538;0.9846"/>
    <rect x="496" y="179" width="436" height="28" rx="7" fill="#151b23"/>
    <text x="510" y="197">whoami.local</text>
    <text class="m" x="680" y="197">whoami:80</text>
    <g class="motion"><animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;0.2769;0.9846"/>
      <circle cx="914" cy="193" r="6" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="9 29">
        <animateTransform attributeName="transform" type="rotate" from="0 914 193" to="360 914 193" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g class="settled" opacity="0"><animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2769;0.9846"/><rect x="908" y="189" width="12" height="10" rx="2" fill="#34d399"/><path d="M910.5,189 v-2.5 a3.5,3.5 0 0 1 7,0 v2.5" fill="none" stroke="#34d399" stroke-width="1.8"/></g>
  </g>
  <text class="head" x="500" y="252">events</text>
  <g class="settled" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1538;0.9846"/>
    <text class="f" x="500" y="278">12:00:02</text>
    <text x="572" y="278">whoami.local</text>
    <text class="m" x="700" y="278">routed from its docker labels</text>
  </g>
  <g class="settled" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2769;0.9846"/>
    <text class="f" x="500" y="304">12:00:03</text>
    <text x="572" y="304">whoami.local</text>
    <text class="m" x="700" y="304">certificate issued</text>
  </g>
  <g class="settled" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4615;0.9846"/>
    <text class="f" x="500" y="330">12:00:06</text>
    <text x="572" y="330">proksi.hcl</text>
    <text class="m" x="700" y="330">applied, 0 connections dropped</text>
  </g>
  <rect class="motion" x="494" y="81" width="440" height="32" rx="8" fill="none" stroke="#34d399" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;0;0" keyTimes="0;0.4615;0.4846;0.5692;1"/>
  </rect>
  <g class="settled" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6923;0.9846"/>
    <text class="f" x="500" y="356">12:00:09</text>
    <text x="572" y="356">POST /v1/orders</text>
    <text class="m" x="700" y="356" style="fill:#f87171">429, rule &quot;writes&quot;</text>
  </g>
  <rect class="motion" x="494" y="117" width="440" height="50" rx="8" fill="none" stroke="#818cf8" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.6615;0.6846;0.8769;0.9077;1"/>
  </rect>
  <text class="ui" x="500" y="490">Docker labels, Kubernetes ingresses and the admin API feed the same routes.</text>
</svg>
