<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="title desc">
  <title id="title">proksi.hcl and Proksi, live</title>
  <desc id="desc">On the left, proksi.hcl with two hosts and a rule, and a terminal starting a container with a proksi.host label. On the right, Proksi's routes and events, live: the container's host appears and gets a Let's Encrypt certificate, a second upstream typed into proksi.hcl is applied without dropping connections, and too many login attempts are rate limited by a rule.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #1f2328; white-space: pre; }
    .k { fill: #059669; } .s { fill: #0369a1; } .m { fill: #59636e; } .f { fill: #8c959f; }
    .ui { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; fill: #59636e; }
    .head { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #59636e; letter-spacing: .06em; text-transform: uppercase; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .settled { opacity: 1 !important; } .typed { width: 600px !important; } }
  </style>
  <rect x="10" y="10" width="940" height="590" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <path d="M10,24 a14,14 0 0 1 14,-14 h912 a14,14 0 0 1 14,14 v22 h-940 z" fill="#f6f8fa"/>
  <line x1="10" y1="46" x2="950" y2="46" stroke="#d1d9e0" stroke-width="1.5"/>
  <circle cx="32" cy="28" r="5.5" fill="#ff5f57"/>
  <circle cx="50" cy="28" r="5.5" fill="#febc2e"/>
  <circle cx="68" cy="28" r="5.5" fill="#28c840"/>
  <text class="ui" x="110" y="32">proksi.hcl</text>
  <text class="ui" x="500" y="32">Proksi · live</text>
  <line x1="480" y1="46" x2="480" y2="600" stroke="#d1d9e0" stroke-width="1.5"/>
  <rect class="motion" x="12" y="271" width="466" height="204" fill="#e0e7ff" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.6615;0.6846;0.8769;0.9077;1"/>
  </rect>
  <rect class="motion" x="12" y="135" width="466" height="17" fill="#d1fae5" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.3692;0.3846;0.5385;0.5692;1"/>
  </rect>
  <defs>
    <clipPath id="typing-line"><rect class="typed" x="64" y="134" height="17" width="0">
      <animate attributeName="width" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;220;220;0" keyTimes="0;0.3692;0.4462;0.9846;1"/>
    </rect></clipPath>
    <clipPath id="typing-command"><rect class="typed" x="46" y="550" height="20" width="0">
      <animate attributeName="width" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;358;358;0" keyTimes="0;0.0231;0.1231;0.9846;1"/>
    </rect></clipPath>
  </defs>
  <text class="f" x="50" y="96" text-anchor="end">1</text>
  <text x="64" y="96"><tspan class="k">host</tspan> <tspan class="s">&quot;shop.example.com&quot;</tspan> {</text>
  <text class="f" x="50" y="113" text-anchor="end">2</text>
  <text x="64" y="113">  <tspan class="k">location</tspan> <tspan class="s">&quot;/&quot;</tspan> {</text>
  <text class="f" x="50" y="130" text-anchor="end">3</text>
  <text x="64" y="130">    <tspan class="k">upstream</tspan> <tspan class="s">&quot;app-1:3000&quot;</tspan> {}</text>
  <text class="f" x="50" y="147" text-anchor="end">4</text>
  <text x="64" y="147" clip-path="url(#typing-line)">    <tspan class="k">upstream</tspan> <tspan class="s">&quot;app-2:3000&quot;</tspan> {}</text>
  <text class="f" x="50" y="164" text-anchor="end">5</text>
  <text x="64" y="164">  }</text>
  <text class="f" x="50" y="181" text-anchor="end">6</text>
  <text x="64" y="181">}</text>
  <text class="f" x="50" y="198" text-anchor="end">7</text>
  <text x="64" y="198"></text>
  <text class="f" x="50" y="215" text-anchor="end">8</text>
  <text x="64" y="215"><tspan class="k">host</tspan> <tspan class="s">&quot;api.example.com&quot;</tspan> {</text>
  <text class="f" x="50" y="232" text-anchor="end">9</text>
  <text x="64" y="232">  <tspan class="k">location</tspan> <tspan class="s">&quot;/v1&quot;</tspan> {</text>
  <text class="f" x="50" y="249" text-anchor="end">10</text>
  <text x="64" y="249">    <tspan class="k">upstream</tspan> <tspan class="s">&quot;api:4000&quot;</tspan> {}</text>
  <text class="f" x="50" y="266" text-anchor="end">11</text>
  <text x="64" y="266">  }</text>
  <text class="f" x="50" y="283" text-anchor="end">12</text>
  <text x="64" y="283">  <tspan class="k">rule</tspan> <tspan class="s">&quot;slow down login attempts&quot;</tspan> {</text>
  <text class="f" x="50" y="300" text-anchor="end">13</text>
  <text x="64" y="300">    <tspan class="k">and</tspan> {</text>
  <text class="f" x="50" y="317" text-anchor="end">14</text>
  <text x="64" y="317">      path { prefix = <tspan class="s">&quot;/v1/login&quot;</tspan> }</text>
  <text class="f" x="50" y="334" text-anchor="end">15</text>
  <text x="64" y="334">      method { in = [<tspan class="s">&quot;POST&quot;</tspan>] }</text>
  <text class="f" x="50" y="351" text-anchor="end">16</text>
  <text x="64" y="351">    }</text>
  <text class="f" x="50" y="368" text-anchor="end">17</text>
  <text x="64" y="368">    <tspan class="k">then</tspan> {</text>
  <text class="f" x="50" y="385" text-anchor="end">18</text>
  <text x="64" y="385">      rate_limit {</text>
  <text class="f" x="50" y="402" text-anchor="end">19</text>
  <text x="64" y="402">        requests = 5</text>
  <text class="f" x="50" y="419" text-anchor="end">20</text>
  <text x="64" y="419">        per      = <tspan class="s">&quot;1m&quot;</tspan></text>
  <text class="f" x="50" y="436" text-anchor="end">21</text>
  <text x="64" y="436">      }</text>
  <text class="f" x="50" y="453" text-anchor="end">22</text>
  <text x="64" y="453">    }</text>
  <text class="f" x="50" y="470" text-anchor="end">23</text>
  <text x="64" y="470">  }</text>
  <text class="f" x="50" y="487" text-anchor="end">24</text>
  <text x="64" y="487">}</text>
  <line x1="10" y1="512" x2="480" y2="512" stroke="#d1d9e0" stroke-width="1.5"/>
  <text class="head" x="30" y="540">terminal</text>
  <text class="k" x="30" y="566">$</text>
  <text x="46" y="566" clip-path="url(#typing-command)">docker run -l proksi.host=whoami.local whoami</text>
  <text class="head" x="500" y="84">routes</text>
  <g>
    <rect x="496" y="104" width="436" height="34" rx="8" fill="#f6f8fa"/>
    <text x="510" y="125">shop.example.com</text>
    <text class="m motion" x="680" y="125">app-1
      <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;0.4615;0.9846"/>
    </text>
    <text class="m settled" x="680" y="125" opacity="0">app-1, app-2
      <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4615;0.9846"/>
    </text>
    <rect x="908" y="117" width="12" height="10" rx="2" fill="#059669"/><path d="M910.5,117 v-2.5 a3.5,3.5 0 0 1 7,0 v2.5" fill="none" stroke="#059669" stroke-width="1.8"/>
  </g>
  <g>
    <rect x="496" y="154" width="436" height="60" rx="8" fill="#f6f8fa"/>
    <text x="510" y="175">api.example.com</text>
    <text class="m" x="680" y="175">api:4000</text>
    <rect x="908" y="167" width="12" height="10" rx="2" fill="#059669"/><path d="M910.5,167 v-2.5 a3.5,3.5 0 0 1 7,0 v2.5" fill="none" stroke="#059669" stroke-width="1.8"/>
    <text class="m" x="526" y="204">↳ rule "slow down login attempts"  →  rate_limit</text>
  </g>
  <g class="settled">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1538;0.9846"/>
    <rect x="496" y="230" width="436" height="34" rx="8" fill="#f6f8fa"/>
    <text x="510" y="251">whoami.local</text>
    <text class="m" x="680" y="251">whoami:80</text>
    <g class="motion"><animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;0.2769;0.9846"/>
      <circle cx="914" cy="247" r="6" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="9 29">
        <animateTransform attributeName="transform" type="rotate" from="0 914 247" to="360 914 247" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g class="settled" opacity="0"><animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2769;0.9846"/><rect x="908" y="243" width="12" height="10" rx="2" fill="#059669"/><path d="M910.5,243 v-2.5 a3.5,3.5 0 0 1 7,0 v2.5" fill="none" stroke="#059669" stroke-width="1.8"/></g>
  </g>
  <text class="head" x="500" y="330">events</text>
  <g class="settled" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1538;0.9846"/>
    <text class="f" x="500" y="366">12:00:02</text>
    <text x="572" y="366">whoami.local</text>
    <text class="m" x="692" y="366">routed from its docker labels</text>
  </g>
  <g class="settled" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2769;0.9846"/>
    <text class="f" x="500" y="398">12:00:03</text>
    <text x="572" y="398">whoami.local</text>
    <text class="m" x="692" y="398">certificate issued</text>
  </g>
  <g class="settled" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4615;0.9846"/>
    <text class="f" x="500" y="430">12:00:06</text>
    <text x="572" y="430">proksi.hcl</text>
    <text class="m" x="692" y="430">applied, 0 connections dropped</text>
  </g>
  <rect class="motion" x="494" y="102" width="440" height="38" rx="9" fill="none" stroke="#059669" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;0;0" keyTimes="0;0.4615;0.4846;0.5692;1"/>
  </rect>
  <g class="settled" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6923;0.9846"/>
    <text class="f" x="500" y="462">12:00:09</text>
    <text x="572" y="462">POST /v1/login</text>
    <text class="m" x="692" y="462" style="fill:#cf222e">429 (slow down login attempts)</text>
  </g>
  <rect class="motion" x="494" y="152" width="440" height="64" rx="9" fill="none" stroke="#6366f1" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="13.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.6615;0.6846;0.8769;0.9077;1"/>
  </rect>
  <text class="ui" x="500" y="572">Docker labels, Kubernetes ingresses and the admin API feed the same routes.</text>
</svg>
