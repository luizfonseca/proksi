    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; fill: #1f2328; }
    .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #59636e; letter-spacing: .06em; text-transform: uppercase; }
    .title { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; fill: #059669; }
    .wire { fill: none; stroke: #d1d9e0; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) { .packet, .glow { display: none; } .wire { animation: none; } }
  </style>
